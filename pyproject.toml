[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretty-release-notes"
dynamic = ["version"]
description = "Transform GitHub release notes with AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Raffael Meyer" }
]
keywords = ["github", "release-notes", "llm", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "typer~=0.24.0",
    "rich~=15.0",
    "requests~=2.33",
    "python-dotenv~=1.2",
    "tenacity~=9.1",
    "any-llm-sdk[all]~=1.13",
]

[project.optional-dependencies]
web = [
    "fastapi~=0.136.0",
    "uvicorn~=0.44.0",
    "pydantic~=2.13",
]
dev = [
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "mypy~=1.20",
    "ruff~=0.15.0",
    "types-requests~=2.33.0.20260408",
]

[project.scripts]
pretty-release-notes = "pretty_release_notes.main:app"

[project.urls]
Homepage = "https://github.com/barredterra/pretty_release_notes"
Documentation = "https://github.com/barredterra/pretty_release_notes#readme"
Repository = "https://github.com/barredterra/pretty_release_notes"
Issues = "https://github.com/barredterra/pretty_release_notes/issues"

[tool.setuptools.dynamic]
version = {attr = "pretty_release_notes.__version__"}

[tool.setuptools]
packages = [
    "pretty_release_notes",
    "pretty_release_notes.core",
    "pretty_release_notes.models",
    "pretty_release_notes.adapters",
    "pretty_release_notes.web",
]

[tool.setuptools.package-data]
pretty_release_notes = ["py.typed", "prompt.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
# Use ruff for formatting (replaces black)
quote-style = "double"
indent-style = "tab"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "W191", # Indentation contains tabs
]

[tool.uv]
exclude-newer = "1 week"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=pretty_release_notes --cov-report=html --cov-report=term-missing"
